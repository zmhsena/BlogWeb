<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sena's notebook 文章详情。">
    <title>文章 | Sena's notebook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body class="site-page article-page">
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="site-header">
        <div class="site-shell header-inner">
            <a class="brand" href="index.html" aria-label="Sena's notebook 首页">
                <span class="brand-mark" aria-hidden="true">SN</span>
                <span class="brand-name">Sena's notebook</span>
            </a>
            <nav class="primary-nav" aria-label="主导航">
                <a href="index.html#notes">文章</a>
                <a href="index.html#about">关于</a>
                <a class="nav-action" href="admin.html">管理后台</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="site-shell article-main">
        <nav class="breadcrumb" aria-label="面包屑导航">
            <a class="back-link" href="index.html#notes"><span aria-hidden="true">←</span> 返回文章列表</a>
            <span aria-hidden="true">/</span>
            <span>文章详情</span>
        </nav>

        <div class="article-layout">
            <article class="article-shell">
                <header class="article-header">
                    <p id="detail-kicker" class="eyebrow">NOTE / 正在读取</p>
                    <h1 id="detail-title">正在加载文章...</h1>
                    <div id="detail-meta" class="article-meta" aria-live="polite"></div>
                </header>
                <div id="detail-status" class="article-status" aria-live="polite"></div>
                <div id="detail-content" class="markdown-body"></div>
                <footer class="article-footer">
                    <a class="back-link" href="index.html#notes"><span aria-hidden="true">←</span> 返回文章列表</a>
                    <button class="top-button" type="button" data-scroll-top aria-label="返回顶部">返回顶部 <span aria-hidden="true">↑</span></button>
                </footer>
            </article>

            <aside class="article-rail" aria-label="阅读提示">
                <span class="rail-label">READING NOTE</span>
                <p>慢一点读。好的笔记不只保存答案，也保存当时的问题。</p>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <div class="site-shell footer-inner">
            <span>© Sena's notebook</span>
            <a class="text-link" href="index.html">回到首页 <span aria-hidden="true">↗</span></a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="githubService.js"></script>
    <script src="data-loader.js"></script>
    <script src="render-utils.js"></script>
    <script src="post.js"></script>
    <script src="cursor-effect.js"></script>
</body>
</html>
