<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sena's notebook 写作工作台。">
    <title>写作工作台 | Sena's notebook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="site-page admin-page">
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="site-header">
        <div class="site-shell header-inner">
            <a class="brand" href="index.html" aria-label="Sena's notebook 首页">
                <span class="brand-mark" aria-hidden="true">SN</span>
                <span class="brand-name">Sena's notebook</span>
            </a>
            <nav class="primary-nav" aria-label="主导航">
                <a href="index.html#notes">返回文章</a>
                <a href="index.html#about">关于</a>
                <a class="nav-action" href="index.html">退出工作台</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="site-shell admin-container">
        <header class="admin-heading">
            <p class="eyebrow">AUTHORING / 写作</p>
            <h1>写作工作台</h1>
            <p>在这里整理 Markdown 笔记，预览内容，并同步到 GitHub。</p>
        </header>

        <section class="token-section" aria-labelledby="connection-title">
            <div class="admin-section-heading">
                <div>
                    <p class="section-kicker">CONNECTION</p>
                    <h2 id="connection-title">连接 GitHub</h2>
                </div>
                <div id="admin-status" role="status" aria-live="polite"></div>
            </div>
            <label for="token-input">Personal Access Token</label>
            <div class="token-input-group">
                <input type="password" id="token-input" autocomplete="off" placeholder="输入 GitHub Token">
                <button id="save-token-btn" type="button">保存到本地</button>
                <button id="clear-token-btn" class="secondary-button" type="button">清除</button>
            </div>
            <p class="field-help">令牌只保存在当前浏览器的本地存储中，不会写入文章或提交到仓库。</p>
        </section>

        <div class="admin-main">
            <section class="list-section" aria-labelledby="existing-posts-title">
                <div class="admin-section-heading">
                    <div>
                        <p class="section-kicker">LIBRARY</p>
                        <h2 id="existing-posts-title">已有文章</h2>
                    </div>
                    <button id="new-post-btn" class="secondary-button" type="button">新建文章</button>
                </div>
                <div id="admin-post-list" class="scroll-window" aria-live="polite"></div>
            </section>

            <section class="edit-section" aria-labelledby="form-title">
                <form id="editor-form">
                    <div class="editor-heading">
                        <p class="section-kicker">EDITOR</p>
                        <h2 id="form-title">撰写新文章</h2>
                    </div>
                    <input type="hidden" id="edit-index" value="-1">

                    <div class="field-group">
                        <label for="post-title">标题</label>
                        <input type="text" id="post-title" autocomplete="off" placeholder="给这篇笔记一个标题">
                    </div>
                    <div class="field-group">
                        <label for="post-category">分类</label>
                        <input type="text" id="post-category" autocomplete="off" placeholder="例如：Unity、工具、阅读">
                    </div>

                    <div class="toolbar" role="toolbar" aria-label="Markdown 格式工具">
                        <button type="button" data-format="big" aria-label="增大选中文字">H</button>
                        <button type="button" data-format="bold" aria-label="加粗"><strong>B</strong></button>
                        <button type="button" data-format="italic" aria-label="斜体"><em>I</em></button>
                        <div class="color-dropdown">
                            <button type="button" aria-label="选择文字颜色">颜色</button>
                            <div class="color-menu" role="menu" aria-label="文字颜色">
                                <button class="color-option swatch-rust" type="button" data-format="color" data-color="#c56b4c" aria-label="Rust"></button>
                                <button class="color-option swatch-teal" type="button" data-format="color" data-color="#1f6f68" aria-label="Teal"></button>
                                <button class="color-option swatch-blue" type="button" data-format="color" data-color="#2f6f9f" aria-label="Blue"></button>
                                <button class="color-option swatch-gold" type="button" data-format="color" data-color="#8a6d1d" aria-label="Gold"></button>
                            </div>
                        </div>
                        <button type="button" data-format="highlight">强调</button>
                        <button type="button" data-format="image">图片</button>
                    </div>

                    <div class="field-group editor-content-group">
                        <label for="post-content">正文 Markdown</label>
                        <textarea id="post-content" rows="15" placeholder="从这里开始写..." spellcheck="false"></textarea>
                        <p class="field-help">也可以把图片拖到编辑区，发布时会一起上传。</p>
                    </div>

                    <div class="editor-preview">
                        <div class="preview-label">LIVE PREVIEW / 实时预览</div>
                        <div id="live-preview" class="markdown-body" role="region" aria-label="实时预览"></div>
                    </div>

                    <div class="form-actions">
                        <button id="submit-btn" type="submit">发布并同步到 GitHub</button>
                        <button id="reset-btn" class="secondary-button" type="button">取消修改</button>
                    </div>
                    <div id="publish-status" role="status" aria-live="polite"></div>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="site-shell footer-inner">
            <span>© Sena's notebook</span>
            <a class="text-link" href="index.html">回到首页 <span aria-hidden="true">↗</span></a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="githubService.js"></script>
    <script src="data-loader.js"></script>
    <script src="render-utils.js"></script>
    <script src="admin.js"></script>
</body>
</html>
